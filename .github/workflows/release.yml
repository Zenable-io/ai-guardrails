---
name: "Release"

permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: 'bash --noprofile --norc -Eeuo pipefail {0}'

env:
  python_version: "3.13"
  semantic_release_version: "10.6.1"

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-24.04
    concurrency: release
    # Only run on non-release commits to avoid loops
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_version }}

      - name: Install semantic-release
        # We install the CLI ourselves instead of using the upstream composite
        # action. That action builds its Docker image on the runner from an
        # unpinned requirements file, so GitPython 3.1.60 — which removed
        # `Actor.name_email_regex`, an attribute semantic-release reads on every
        # config load — broke every release run, including reruns of workflows
        # that hadn't changed in months. There is no action input to constrain
        # the image's transitive deps, so pinning here is the only fix available
        # to a caller. See python-semantic-release#1476; drop the GitPython pin
        # once the fix (#1477) ships in a release.
        run: pip install "python-semantic-release==${{ env.semantic_release_version }}" "gitpython<3.1.60"

      - name: Run the Release
        id: release
        env:
          # semantic-release reads GH_TOKEN for the release API and the tag push.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Zenable Automation"
          git config user.email "automation@zenable.io"

          # `version --print` reports the version that a release would produce,
          # falling back to the current version when nothing warrants a bump, so
          # comparing it against the last released version tells us whether this
          # push releases anything. Both are read-only.
          # Tolerate a failure here only: a repo with no prior release has no
          # last version to print. `--print` stays strict — an empty result there
          # means something is wrong, not that there's nothing to release.
          last="$(semantic-release version --print-last-released || true)"
          next="$(semantic-release version --print)"

          if [[ -z "$next" || "$next" == "$last" ]]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tag-only: --no-commit leaves main untouched (the push is a no-op the
          # branch ruleset ignores) while the tag still pushes and cuts the release.
          semantic-release -v version --no-commit --tag --push --vcs-release

          {
            echo "released=true"
            echo "version=$next"
            echo "tag=v$next"
            echo "commit_sha=$(git rev-parse HEAD)"
            # A PEP 440 / SemVer prerelease is the only kind carrying a `-suffix`.
            if [[ "$next" == *-* ]]; then echo "is_prerelease=true"; else echo "is_prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Move the floating major-version and latest tags
        # Floating tags (like GitHub Actions): v<major> tracks the latest release
        # on its major line, `latest` tracks the newest overall. Skip prereleases.
        if: steps.release.outputs.released == 'true' && steps.release.outputs.is_prerelease == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          major="v${VERSION%%.*}"
          git tag -f "$major" "$SHA"
          git tag -f latest "$SHA"
          git push -f origin "refs/tags/$major" "refs/tags/latest"

      - name: Summary
        if: steps.release.outputs.released == 'true'
        run: |
          echo "### 🚀 New Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The release has been created and tagged." >> $GITHUB_STEP_SUMMARY

      - name: No release
        if: steps.release.outputs.released == 'false'
        run: |
          echo "### ℹ️ No Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No new version was released. This is normal if:" >> $GITHUB_STEP_SUMMARY
          echo "- No conventional commits since last release" >> $GITHUB_STEP_SUMMARY
          echo "- Only chore/docs commits (which don't trigger releases)" >> $GITHUB_STEP_SUMMARY
