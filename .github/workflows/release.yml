---
name: "Release"

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Force a specific bump instead of deriving it from the commits since
          the last release. Use when the commit history under-represents the
          change (or to cut a sync release after a process fix).
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

defaults:
  run:
    shell: 'bash --noprofile --norc -Eeuo pipefail {0}'

env:
  python_version: "3.13"
  semantic_release_version: "10.6.1"

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-24.04
    concurrency: release
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Pushes must authenticate as the ZenableAutomation machine user (this
          # key lives on that account) so the main ruleset's Automation-team
          # bypass applies; GITHUB_TOKEN authenticates as github-actions[bot],
          # which the ruleset would reject.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_version }}

      - name: Install semantic-release
        # Installed here rather than via python-semantic-release's own action: that
        # action builds its image on the runner from a requirements file pinning
        # only semantic-release itself, so GitPython 3.1.60 — which removed the
        # `Actor.name_email_regex` that semantic-release reads on every config
        # load — breaks every run, and no action ref or input avoids it. Owning the
        # install is what lets us pin. See python-semantic-release#1476; drop the
        # GitPython pin once the fix (#1477) ships.
        run: pip install "python-semantic-release==${{ env.semantic_release_version }}" "gitpython<3.1.60"

      - name: Run the Release
        id: release
        env:
          # semantic-release reads GH_TOKEN for the commit/tag push and the release API.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || 'auto' }}
        run: |
          git config user.name "Zenable Automation"
          git config user.email "automation@zenable.io"

          force_args=()
          [[ "$FORCE" != "auto" ]] && force_args=("--$FORCE")

          # `version --print` reports what a release would produce, or the current
          # version when nothing warrants a bump — so matching the last released
          # version means this dispatch releases nothing. Both commands are read-only.
          version="$(semantic-release version --print "${force_args[@]}")"
          if [[ "$version" == "$(semantic-release version --print-last-released)" ]]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Writes the new version into the manifests (version_toml/version_variables
          # in pyproject.toml), commits them with the changelog, pushes the commit to
          # main, tags that commit, and cuts the GitHub release — so the released tag
          # always points at a commit whose manifests carry the released version.
          # The push goes over SSH as ZenableAutomation (see the checkout step).
          semantic-release -v version --commit --tag --push --vcs-release "${force_args[@]}"

          # Only a prerelease carries a `-suffix`.
          [[ "$version" == *-* ]] && prerelease=true || prerelease=false
          printf '%s\n' "released=true" "version=$version" "tag=v$version" \
            "commit_sha=$(git rev-parse HEAD)" "is_prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Move the floating major-version and latest tags
        # Floating tags (like GitHub Actions): v<major> tracks the latest release
        # on its major line, `latest` tracks the newest overall. Skip prereleases.
        if: steps.release.outputs.released == 'true' && steps.release.outputs.is_prerelease == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          major="v${VERSION%%.*}"
          git tag -f "$major" "$SHA"
          git tag -f latest "$SHA"
          git push -f origin "refs/tags/$major" "refs/tags/latest"

      - name: Summary
        if: steps.release.outputs.released == 'true'
        run: |
          echo "### 🚀 New Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The release commit has been pushed to main, tagged, and released." >> $GITHUB_STEP_SUMMARY

      - name: No release
        if: steps.release.outputs.released == 'false'
        run: |
          echo "### ℹ️ No Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No new version was released. This is normal if:" >> $GITHUB_STEP_SUMMARY
          echo "- No conventional commits since the last release warrant a bump" >> $GITHUB_STEP_SUMMARY
          echo "- Only chore/docs commits landed (which don't trigger releases)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Re-run with the \`force\` input set to cut one anyway." >> $GITHUB_STEP_SUMMARY
